[package]
name = "sync-line"
version = "0.2.0"
edition = "2024"

[dependencies]
axum = "0.8"
rand = "0.8"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "derive", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
rmcp = { version = "3.12.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["uuid1"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
